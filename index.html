<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SplitCheck</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f1ea;
      --card: #fffdf8;
      --ink: #1c1915;
      --muted: #5c564c;
      --line: #e4ddd0;
      --accent: #0f6e56;
      --accent-ink: #f4fbf8;
      --danger: #9f2d2d;
      --shadow: 0 12px 40px rgba(28, 25, 21, 0.08);
    }

    body[data-theme="dark"] {
      color-scheme: dark;
      --bg: #141311;
      --card: #1e1c19;
      --ink: #f4f1ea;
      --muted: #b7b0a4;
      --line: #3a352e;
      --accent: #3cbf9a;
      --accent-ink: #10231c;
      --danger: #ffb4b4;
      --shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Georgia, "Iowan Old Style", "Palatino Linotype", serif;
      background: var(--bg);
      color: var(--ink);
    }

    main {
      max-width: 28rem;
      margin: 0 auto;
      padding: 2.5rem 1.25rem 3rem;
    }

    header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    h1 {
      margin: 0;
      font-size: 2rem;
      letter-spacing: -0.03em;
    }

    p.lede {
      margin: 0.35rem 0 0;
      color: var(--muted);
      font-family: "Segoe UI", sans-serif;
      font-size: 0.95rem;
    }

    button, input {
      font: inherit;
    }

    #theme-toggle {
      font-family: "Segoe UI", sans-serif;
      font-size: 0.85rem;
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--ink);
      border-radius: 999px;
      padding: 0.45rem 0.8rem;
      cursor: pointer;
    }

    form, #result {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 1rem;
      box-shadow: var(--shadow);
    }

    form {
      display: grid;
      gap: 1rem;
      padding: 1.25rem;
    }

    label {
      display: grid;
      gap: 0.4rem;
      font-family: "Segoe UI", sans-serif;
      font-size: 0.85rem;
      font-weight: 650;
    }

    input[type="number"] {
      width: 100%;
      border: 1px solid var(--line);
      background: var(--bg);
      color: var(--ink);
      border-radius: 0.6rem;
      padding: 0.7rem 0.75rem;
      font-family: "Segoe UI", sans-serif;
      font-size: 1.05rem;
    }

    .tips {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
    }

    .tips button {
      font-family: "Segoe UI", sans-serif;
      font-size: 0.85rem;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--ink);
      border-radius: 999px;
      padding: 0.35rem 0.7rem;
      cursor: pointer;
    }

    .tips button[aria-pressed="true"] {
      background: var(--accent);
      color: var(--accent-ink);
      border-color: var(--accent);
    }

    #error {
      margin: 0;
      min-height: 1.2rem;
      color: var(--danger);
      font-family: "Segoe UI", sans-serif;
      font-size: 0.85rem;
    }

    #result {
      margin-top: 1rem;
      padding: 1.25rem;
      display: grid;
      gap: 0.85rem;
    }

    #result dl {
      margin: 0;
      display: grid;
      gap: 0.65rem;
    }

    #result div {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      font-family: "Segoe UI", sans-serif;
    }

    dt { color: var(--muted); }

    dd {
      margin: 0;
      font-variant-numeric: tabular-nums;
      font-weight: 650;
    }

    #each {
      font-size: 1.35rem;
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>SplitCheck</h1>
        <p class="lede">Split a bill, tip included.</p>
      </div>
      <button id="theme-toggle" type="button" aria-pressed="false">Dark mode</button>
    </header>

    <form id="split-form">
      <label>
        Bill
        <input id="bill" name="bill" type="number" inputmode="decimal" min="0" step="0.01" value="48.00" required>
      </label>

      <label>
        Tip percent
        <input id="tip" name="tip" type="number" inputmode="decimal" min="0" step="0.1" value="18" required>
      </label>
      <div class="tips" role="group" aria-label="Common tip percents">
        <button type="button" data-tip="10">10%</button>
        <button type="button" data-tip="15">15%</button>
        <button type="button" data-tip="18">18%</button>
        <button type="button" data-tip="20">20%</button>
      </div>

      <label>
        People
        <input id="people" name="people" type="number" inputmode="numeric" min="1" step="1" value="2" required>
      </label>

      <p id="error" role="alert"></p>
    </form>

    <section id="result" aria-live="polite">
      <dl>
        <div>
          <dt>Tip</dt>
          <dd id="tip-amount">$0.00</dd>
        </div>
        <div>
          <dt>Total</dt>
          <dd id="total">$0.00</dd>
        </div>
        <div>
          <dt>Each person</dt>
          <dd id="each">$0.00</dd>
        </div>
      </dl>
    </section>
  </main>

  <script>
    const billInput = document.querySelector("#bill");
    const tipInput = document.querySelector("#tip");
    const peopleInput = document.querySelector("#people");
    const error = document.querySelector("#error");
    const tipAmount = document.querySelector("#tip-amount");
    const totalOut = document.querySelector("#total");
    const eachOut = document.querySelector("#each");
    const themeToggle = document.querySelector("#theme-toggle");
    const tipButtons = document.querySelectorAll("[data-tip]");

    const money = new Intl.NumberFormat("en-US", {
      style: "currency",
      currency: "USD"
    });

    function parseField(input) {
      if (input.value.trim() === "") return null;
      const value = Number(input.value);
      return Number.isFinite(value) ? value : null;
    }

    function syncTipButtons() {
      const tip = parseField(tipInput);
      tipButtons.forEach((button) => {
        const match = tip !== null && Number(button.dataset.tip) === tip;
        button.setAttribute("aria-pressed", match ? "true" : "false");
      });
    }

    function showError(message) {
      error.textContent = message;
      tipAmount.textContent = "—";
      totalOut.textContent = "—";
      eachOut.textContent = "—";
    }

    function calculate() {
      const bill = parseField(billInput);
      const tipPercent = parseField(tipInput);
      const people = parseField(peopleInput);
      syncTipButtons();

      if (bill === null || tipPercent === null || people === null) {
        showError("Enter a bill, a tip percent, and how many people.");
        return;
      }
      if (bill < 0 || tipPercent < 0) {
        showError("Bill and tip percent cannot be negative.");
        return;
      }
      if (!Number.isInteger(people) || people < 1) {
        showError("People must be a whole number of at least 1.");
        return;
      }

      const tip = bill * (tipPercent / 100);
      const total = bill + tip;
      const each = total / people;

      error.textContent = "";
      tipAmount.textContent = money.format(tip);
      totalOut.textContent = money.format(total);
      eachOut.textContent = money.format(each);
    }

    document.querySelector("#split-form").addEventListener("input", calculate);

    tipButtons.forEach((button) => {
      button.addEventListener("click", () => {
        tipInput.value = button.dataset.tip;
        calculate();
      });
    });

    themeToggle.addEventListener("click", () => {
      const next = document.body.dataset.theme === "dark" ? "light" : "dark";
      document.body.dataset.theme = next;
      const dark = next === "dark";
      themeToggle.setAttribute("aria-pressed", dark ? "true" : "false");
      themeToggle.textContent = dark ? "Light mode" : "Dark mode";
    });

    if (window.matchMedia("(prefers-color-scheme: dark)").matches) {
      themeToggle.click();
    }

    calculate();
  </script>
</body>
</html>
